name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build XPI
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: citation-graph-xpi
          path: build/*.xpi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/citation-graph-*.xpi
            build/updates.json
          generate_release_notes: true
